[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eventflow"
version = "0.1.0"
description = "Event-driven orders service with transactional outbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "aio-pika>=9.4.0",
  "aiokafka>=0.10.0",
  "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eventflow"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/eventflow/api/routes/*.py" = ["B008"]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "rabbitmq: tests requiring RabbitMQ",
  "kafka: tests requiring Kafka",
  "concurrency: concurrency scenarios",
  "failure: failure injection",
  "lab: comparative lab E1-E9",
]
testpaths = ["tests"]
